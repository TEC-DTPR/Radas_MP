name: Radar MP

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determinar momento del dia
        id: momento
        run: |
          HORA_UTC=$(date -u +%H)
          if [ "$HORA_UTC" -lt 14 ]; then
            echo "valor=am" >> "$GITHUB_OUTPUT"
          elif [ "$HORA_UTC" -lt 20 ]; then
            echo "valor=mediodia" >> "$GITHUB_OUTPUT"
          else
            echo "valor=pm" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar reporte
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
        run: python3 mp_client.py ${{ steps.momento.outputs.valor }}

      - name: Guardar reporte.json en el repo
        run: |
          git config user.name "Radar MP bot"
          git config user.email "actions@github.com"
          git add reporte.json
          git diff --staged --quiet || git commit -m "Reporte ${{ steps.momento.outputs.valor }}"
          git push
